<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Kod Yaratish</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
}
input {
  padding: 8px;
  font-size: 16px;
  width: 200px;
}
button {
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
  margin-left: 10px;
}
#qrcode {
  margin-top: 20px;
}
</style>
</head>
<body>

<h2>Matn uchun QR yaratish</h2>
<input id="textInput" placeholder="Masalan: Salom">
<button onclick="generateQR()">QR yaratish</button>
<div id="qrcode"></div>

<script>
function generateQR() {
  const text = document.getElementById("textInput").value.trim();
  if (!text) return alert("Matn kiriting!");

  document.getElementById("qrcode").innerHTML = "";

  // display.html sahifasiga URL
  const url = `https://qr-kod-ql93.vercel.app/display.html?text=${encodeURIComponent(text)}`;

  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 200,
    height: 200
  });
}
</script>

</body>
</html>
